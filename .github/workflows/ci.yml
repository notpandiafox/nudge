name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNUDGE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build
      - name: Fast tests
        run: ctest --test-dir build -L fast --output-on-failure

  clang:
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNUDGE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build
      - name: Fast tests
        run: ctest --test-dir build -L fast --output-on-failure

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy-18
          pip install clang-format==23.1.3
      - name: Formatting
        run: git ls-files 'solver/*.cpp' 'solver/*.hpp' | xargs clang-format --dry-run --Werror
      - name: Configure (compile commands for clang-tidy)
        run: cmake -S . -B build -G Ninja -DNUDGE_BUILD_TESTS=OFF
      - name: clang-tidy
        run: clang-tidy-18 -p build $(git ls-files 'solver/src/*.cpp')

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          pip install gcovr==8.7
      - name: Configure
        run: cmake -S . -B build-cov -G Ninja -DCMAKE_BUILD_TYPE=Debug -DNUDGE_COVERAGE=ON
      - name: Build
        run: cmake --build build-cov
      - name: Fast tests
        run: ctest --test-dir build-cov -L fast --output-on-failure
      - name: Coverage gate (100% lines and functions)
        run: >
          mkdir -p coverage &&
          gcovr -r . --object-directory build-cov
          --filter solver/src/ --filter solver/include/
          --fail-under-line 100 --fail-under-function 100
          --exclude-throw-branches --exclude-unreachable-branches
          --txt --html-details coverage/index.html
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
