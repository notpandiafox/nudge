name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNUDGE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build
      - name: Fast tests
        run: ctest --test-dir build -L fast --no-tests=error --output-on-failure
      # Every game of the real lists; --verbose prints the guess distribution.
      - name: Slow tests
        run: ctest --test-dir build -L slow --no-tests=error --output-on-failure --verbose

  clang:
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNUDGE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build
      - name: Fast tests
        run: ctest --test-dir build -L fast --no-tests=error --output-on-failure

  # AddressSanitizer and UBSan catch memory bugs and undefined behavior.
  # MinGW on Windows has neither, so they only run here (plan §9).
  sanitizers:
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build
      - name: Fast tests
        run: ctest --test-dir build -L fast --no-tests=error --output-on-failure

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy-18
          pip install clang-format==23.1.3
      - name: Formatting
        run: git ls-files 'solver/*.cpp' 'solver/*.hpp' | xargs clang-format --dry-run --Werror
      - name: Configure (compile commands for clang-tidy)
        run: cmake -S . -B build -G Ninja -DNUDGE_BUILD_TESTS=OFF
      - name: clang-tidy
        run: clang-tidy-18 -p build $(git ls-files 'solver/src/*.cpp')

  # Builds the solver as WebAssembly and runs the T4 speed check under Node.
  # Times are reported, not enforced: shared CI machines vary too much (plan §8.5).
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.12
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: emcmake cmake -S . -B build-wasm -G Ninja -DCMAKE_BUILD_TYPE=Release -DNUDGE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-wasm
      - name: Speed check (warm, finds the worst cases)
        run: node build-wasm/solver/bench/nudge_spike.js
      - name: Speed check (cold, one hint per fresh process)
        run: |
          node build-wasm/solver/bench/nudge_spike.js xviii 0 answers
          node build-wasm/solver/bench/nudge_spike.js sughs 162 guesses

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install pytest==9.1.1 pytest-cov==7.1.0
      - name: Script tests (100% coverage)
        run: >
          pytest scripts/tests --cov=scripts --cov-config=scripts/.coveragerc
          --cov-report=term-missing --cov-fail-under=100

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          pip install gcovr==8.7
      - name: Configure
        run: cmake -S . -B build-cov -G Ninja -DCMAKE_BUILD_TYPE=Debug -DNUDGE_COVERAGE=ON
      - name: Build
        run: cmake --build build-cov
      - name: Fast tests
        run: ctest --test-dir build-cov -L fast --no-tests=error --output-on-failure
      - name: Coverage gate (100% lines and functions)
        run: >
          mkdir -p coverage &&
          gcovr -r . --object-directory build-cov
          --filter solver/src/ --filter solver/include/
          --fail-under-line 100 --fail-under-function 100
          --exclude-throw-branches --exclude-unreachable-branches --exclude-noncode-lines
          --txt --html-details coverage/index.html
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
