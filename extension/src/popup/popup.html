<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nudge</title>
    <style>
      /* Wordle's own colours, like the panel's (spec "How the panel looks"). */
      :root {
        color-scheme: light;
        --page: #ffffff;
        --text: #1a1a1b;
      }
      :root[theme='dark'] {
        color-scheme: dark;
        --page: #121213;
        --text: #f8f8f8;
      }
      /* No saved theme yet (Wordle not seen): Firefox's own setting, with no
         script, so the popup is never painted in the wrong colours first. */
      @media (prefers-color-scheme: dark) {
        :root:not([theme='light']) {
          color-scheme: dark;
          --page: #121213;
          --text: #f8f8f8;
        }
      }
      body {
        margin: 12px 14px;
        width: 220px;
        font:
          14px/1.4 system-ui,
          sans-serif;
        color: var(--text);
        background: var(--page);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Nudge</h1>
    <label><input type="checkbox" role="switch" id="auto" /> Open after each guess</label>
    <script src="popup.js"></script>
  </body>
</html>
